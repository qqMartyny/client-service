spring:
  application:
    name: client-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/client_db}
    username: ${DB_USERNAME:client}
    password: ${DB_PASSWORD:client}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
