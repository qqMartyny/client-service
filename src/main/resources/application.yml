spring:
  application:
    name: client-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/client_db}
    username: ${DB_USERNAME:client}
    password: ${DB_PASSWORD:client}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    type: caffeine
    cache-names: clients
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
