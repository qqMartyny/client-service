services:
  db:
    image: postgres:17-alpine
    container_name: client-db
    environment:
      POSTGRES_DB: client_db
      POSTGRES_USER: client
      POSTGRES_PASSWORD: client
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U client -d client_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: client-service
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/client_db
      DB_USERNAME: client
      DB_PASSWORD: client
    ports:
      - "8080:8080"

volumes:
  pgdata:
